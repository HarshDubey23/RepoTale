name: Bug report
description: Something rendered wrong or a command failed
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened, description: "The command you ran and what you saw. Attach docs/reporeel/sheet.png if it is about the video." }
    validations: { required: true }
  - type: textarea
    attributes: { label: Output of `reporeel setup`, render: text }
    validations: { required: true }
  - type: textarea
    attributes: { label: Storyboard, description: "reporeel.json, or the scene that misbehaves", render: json }
